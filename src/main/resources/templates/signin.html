<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>PayMyBuddy - Connexion</title>
        <link th:href="@{/css/styles.css}" rel="stylesheet">
	</head>
	<body>
		<section>
			<article class="loginFormWrapper">
				<img th:src="@{/images/pmb_logo.png}">
				<form class="loginForm" method="POST" action="#" th:action="@{/signin}" th:object="${userLoginForm}">
					<input aria-label="Fill in your Email Address" type="email" th:field="*{email}" value="" placeholder="Mail" required>
					<input aria-label="Fill in your Password" type="password" th:field="*{password}" value="" placeholder="Mot de passe" required>
					<button type="submit">Se connecter</button>
				</form>
				<p>Pas de compte ? <a href="/signup">Créer un compte</a></p>
			</article>
		</section>
	</body>
</html>
