<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>PayMyBuddy - Connexion</title>
	</head>
	<body>
		<section>
			<form method="POST" action="#" th:action="@{/signup/save}" th:object="${userForm}">
				<header>
					<h1>PayMyBuddy</h1>
				</header>
                <p>Ce compte existe déjà !</p>
				<input aria-label="Fill in your Username" type="text" th:field="*{user}" value="" placeholder="Username">
				<input aria-label="Fill in your Email Address" type="text" th:field="*{email}" value="" placeholder="Mail">
				<input aria-label="Fill in your Password" type="text" th:field="*{password}" value="" placeholder="Mot de passe">
				<button type="submit">S'inscrire</button>
			</form>
			<p>Déjà un compte ? <a href="/signin">Se connecter</a></p>
		</section>
	</body>
</html>
