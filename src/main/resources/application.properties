#App configuration
spring.application.name=PayMyBuddy

#Tomcat configuration
server.port=8080

logging.file.name=logs/app.log
logging.file.path=logs

#SQL configuration
spring.datasource.url=jdbc:mysql://localhost:3306/db_paymybuddy_test?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=rootroot

#Session configuration
server.servlet.session.timeout=9000
server.servlet.session.cookie.name=MY_SESSION_COOKIE
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
